plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.overlaykit.llm'
version = '0.1.0'

android {
  namespace "com.overlaykit.llm"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Pinned (task 3.3). 0.16.1 carries Kotlin metadata 2.3.0 and builds with the Kotlin 2.2.x that
  // React Native 0.88 / Expo SDK 58 resolve. 0.17.x to 0.19.x carry metadata 2.4.0 and need a
  // Kotlin 2.3+ compiler, which would change the build of every native module.
  // The AAR ships arm64-v8a and x86_64 libraries only.
  implementation 'com.google.ai.edge.litertlm:litertlm-android:0.16.1'
}
